<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Authority Login | CIVIQ-AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6fb;
font-family:Arial, Helvetica, sans-serif;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.brand{
font-size:20px;
font-weight:bold;
}

/* LOGIN BOX */

.login-container{
width:380px;
margin:120px auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
}

.login-container h2{
margin-bottom:20px;
color:#1e3a8a;
}

.login-container input,
.login-container select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.login-btn{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#1e293b;
color:white;
font-weight:bold;
cursor:pointer;
}

.login-btn:hover{
background:#0f172a;
}

.error{
color:red;
margin-top:10px;
}

.back-home{
display:block;
margin-top:15px;
text-decoration:none;
color:#555;
}

</style>

</head>


<body>

<!-- NAVBAR -->

<nav>

<div class="brand">
CIVIQ-AI
</div>

<div>
<a href="index.html">Home</a>
</div>

</nav>


<div class="login-container">

<h2>Authority Login</h2>

<input type="email" id="email" placeholder="Authority Email">

<select id="department">

<option value="">Select Department</option>
<option value="Sanitation">Sanitation</option>
<option value="Road">Road Maintenance</option>
<option value="Water">Water Supply</option>
<option value="Electricity">Electricity</option>

</select>

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="handleLogin()">
Login
</button>

<p id="errorMsg" class="error"></p>

<a class="back-home" href="index.html">
← Back to Home
</a>

</div>


<script src="script.js"></script>

<script>

async function handleLogin(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();
const department=document.getElementById("department").value;

if(!email || !password){

document.getElementById("errorMsg").innerText="Please enter email and password";
return;

}

if(!department){

document.getElementById("errorMsg").innerText="Please select department";
return;

}

try{

await loginUser(email,password,department);

}

catch(err){

document.getElementById("errorMsg").innerText="Login failed";

}

}

/* Enter key login */

document.addEventListener("keypress",function(e){

if(e.key==="Enter"){
handleLogin();
}

});

</script>

</body>
</html>
