<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Citizen Login | CIVIQ-AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6fb;
font-family:Arial, Helvetica, sans-serif;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.brand{
font-size:20px;
font-weight:bold;
}

/* LOGIN BOX */

.login-container{
width:380px;
margin:120px auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
}

.login-container h2{
margin-bottom:20px;
color:#1e3a8a;
}

.login-container input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.login-btn{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.login-btn:hover{
background:#1d4ed8;
}

.error{
color:red;
margin-top:10px;
}

.signup-link{
margin-top:15px;
display:block;
text-decoration:none;
}

.back-home{
margin-top:10px;
display:block;
color:#555;
text-decoration:none;
}

</style>

</head>


<body>

<!-- NAVBAR -->

<nav>

<div class="brand">
CIVIQ-AI
</div>

<div>
<a href="signup.html">Sign Up</a>
</div>

</nav>



<div class="login-container">

<h2>Citizen Login</h2>

<input id="email" type="email" placeholder="Enter Email">

<input id="password" type="password" placeholder="Enter Password">

<button class="login-btn" onclick="handleLogin()">
Login
</button>

<p id="errorMsg" class="error"></p>

<a class="signup-link" href="signup.html">
New user? Create Account
</a>

<a class="back-home" href="index.html">
← Back to Home
</a>

</div>


<script src="script.js"></script>

<script>

async function handleLogin(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

if(!email || !password){

document.getElementById("errorMsg").innerText="Please enter email and password";
return;

}

try{

await loginUser(email,password);

}

catch(err){

document.getElementById("errorMsg").innerText="Login failed";

}

}

/* allow Enter key login */

document.addEventListener("keypress",function(e){

if(e.key==="Enter"){
handleLogin();
}

});

</script>

</body>
</html>
