<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Authority Signup | CIVIQ-AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6fb;
font-family:Arial, Helvetica, sans-serif;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.brand{
font-size:20px;
font-weight:bold;
}

/* SIGNUP BOX */

.signup-container{
width:420px;
margin:80px auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
}

.signup-container h2{
margin-bottom:20px;
color:#1e3a8a;
}

.signup-container input,
.signup-container select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.signup-btn{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.signup-btn:hover{
background:#1d4ed8;
}

.error{
color:red;
margin-top:10px;
}

.login-link{
display:block;
margin-top:15px;
text-decoration:none;
}

.back-home{
display:block;
margin-top:10px;
text-decoration:none;
color:#555;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav>

<div class="brand">
CIVIQ-AI
</div>

<div>
<a href="authority_login.html">Authority Login</a>
</div>

</nav>


<div class="signup-container">

<h2>Authority Registration</h2>

<input id="name" type="text" placeholder="Full Name">

<input id="email" type="email" placeholder="Official Email">

<select id="department">

<option value="">Select Department</option>
<option value="Sanitation">Sanitation</option>
<option value="Road">Road Maintenance</option>
<option value="Water">Water Supply</option>
<option value="Electricity">Electricity</option>

</select>

<input id="password" type="password" placeholder="Password">

<input id="confirmPassword" type="password" placeholder="Confirm Password">

<button class="signup-btn" onclick="registerAuthority()">
Register Authority
</button>

<p id="errorMsg" class="error"></p>

<a class="login-link" href="authority_login.html">
Already registered? Login
</a>

<a class="back-home" href="index.html">
← Back to Home
</a>

</div>


<script>

const API_URL = "http://127.0.0.1:5000";

async function registerAuthority(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const department=document.getElementById("department").value;
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(!name || !email || !department || !password || !confirmPassword){

document.getElementById("errorMsg").innerText="Please fill all fields";
return;

}

if(password !== confirmPassword){

document.getElementById("errorMsg").innerText="Passwords do not match";
return;

}

try{

const res = await fetch(`${API_URL}/register_authority`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
email,
password,
department
})

});

const data = await res.json();

if(data.status==="authority_created"){

alert("Authority account created successfully");

window.location.href="authority_login.html";

}

else{

document.getElementById("errorMsg").innerText=data.error || "Signup failed";

}

}

catch(err){

document.getElementById("errorMsg").innerText="Server error";

}

}

</script>

</body>

</html>
