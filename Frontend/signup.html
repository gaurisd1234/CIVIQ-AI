<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Citizen Signup | CIVIQ-AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6fb;
font-family:Arial, Helvetica, sans-serif;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.brand{
font-weight:bold;
font-size:20px;
}

/* SIGNUP BOX */

.signup-container{
width:420px;
margin:80px auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
}

.signup-container h2{
margin-bottom:20px;
color:#1e3a8a;
}

.signup-container input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.signup-btn{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#10B981;
color:white;
font-weight:bold;
cursor:pointer;
}

.signup-btn:hover{
background:#059669;
}

.error{
color:red;
margin-top:10px;
}

.login-link{
display:block;
margin-top:15px;
text-decoration:none;
color:#555;
}

.back-home{
display:block;
margin-top:10px;
text-decoration:none;
color:#555;
}

</style>

</head>


<body>

<!-- NAVBAR -->

<nav>

<div class="brand">
CIVIQ-AI
</div>

<div>
<a href="citizen_login.html">Login</a>
</div>

</nav>


<div class="signup-container">

<h2>Create Citizen Account</h2>

<input id="name" type="text" placeholder="Full Name">

<input id="email" type="email" placeholder="Email Address">

<input id="phone" type="text" placeholder="Phone Number">

<input id="password" type="password" placeholder="Password">

<input id="confirmPassword" type="password" placeholder="Confirm Password">

<button class="signup-btn" onclick="handleSignup()">
Sign Up
</button>

<p id="errorMsg" class="error"></p>

<a class="login-link" href="citizen_login.html">
Already have an account? Login
</a>

<a class="back-home" href="index.html">
← Back to Home
</a>

</div>


<script src="script.js"></script>

<script>

function handleSignup(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(!name || !email || !phone || !password || !confirmPassword){

document.getElementById("errorMsg").innerText="Please fill all fields";
return;

}

if(password.length < 6){

document.getElementById("errorMsg").innerText="Password must be at least 6 characters";
return;

}

if(password !== confirmPassword){

document.getElementById("errorMsg").innerText="Passwords do not match";
return;

}

/* call backend signup */

signupUser(name,email,password);

}

</script>

</body>
</html>
